<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米搜索框案例2</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .search-wrapper {
            max-width: 400px;
            margin: 50px auto;
            position: relative;
        }
        
        .input-group {
            display: flex;
            background: #fff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .search-input {
            flex: 1;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            outline: none;
        }
        
        .search-button {
            background: #ff6700;
            border: none;
            padding: 12px 20px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        
        .search-button:hover {
            background: #e55a00;
        }
        
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .dropdown-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        
        .dropdown-item:hover,
        .dropdown-item.selected {
            background: #f5f5f5;
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        .quick-search {
            margin-top: 20px;
            text-align: center;
        }
        
        .quick-search h4 {
            color: #fff;
            margin-bottom: 10px;
        }
        
        .quick-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 12px;
            margin: 3px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .quick-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="search-wrapper">
        <div class="input-group">
            <input type="text" class="search-input" placeholder="搜索小米商品" autocomplete="off">
            <button class="search-button">搜索</button>
        </div>
        
        <div class="dropdown"></div>
        
        <div class="quick-search">
            <h4>热门搜索</h4>
            <button class="quick-btn">小米14</button>
            <button class="quick-btn">红米K60</button>
            <button class="quick-btn">小米平板</button>
            <button class="quick-btn">小米手环</button>
            <button class="quick-btn">小米电视</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
