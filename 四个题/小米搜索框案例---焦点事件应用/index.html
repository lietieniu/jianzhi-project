<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米搜索框案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 50px;
        }
        
        .search-container {
            width: 500px;
            margin: 0 auto;
            position: relative;
        }
        
        .search-box {
            width: 100%;
            height: 50px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            padding: 0 50px 0 15px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .search-box:focus {
            border-color: #ff6900;
        }
        
        .search-btn {
            position: absolute;
            right: 0;
            top: 0;
            width: 50px;
            height: 50px;
            background-color: #ff6900;
            border: none;
            border-radius: 0 4px 4px 0;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .search-btn:hover {
            background-color: #e55a00;
        }
        
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }
        
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s ease;
        }
        
        .suggestion-item:hover {
            background-color: #f8f8f8;
        }
        
        .suggestion-item:last-child {
            border-bottom: none;
        }
        
        .hot-searches {
            margin-top: 20px;
            text-align: center;
        }
        
        .hot-searches h3 {
            color: #666;
            margin-bottom: 10px;
        }
        
        .hot-tag {
            display: inline-block;
            padding: 5px 12px;
            margin: 5px;
            background-color: #f0f0f0;
            border-radius: 15px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .hot-tag:hover {
            background-color: #ff6900;
            color: white;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" class="search-box" placeholder="小米手机" id="searchInput">
            <button class="search-btn" onclick="performSearch()">🔍</button>
            <div class="suggestions" id="suggestions"></div>
        </div>
        
        <div class="hot-searches">
            <h3>热门搜索</h3>
            <span class="hot-tag" onclick="fillSearch('小米14')">小米14</span>
            <span class="hot-tag" onclick="fillSearch('红米Note12')">红米Note12</span>
            <span class="hot-tag" onclick="fillSearch('小米平板6')">小米平板6</span>
            <span class="hot-tag" onclick="fillSearch('小米手环8')">小米手环8</span>
            <span class="hot-tag" onclick="fillSearch('小米电视')">小米电视</span>
            <span class="hot-tag" onclick="fillSearch('小米路由器')">小米路由器</span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
