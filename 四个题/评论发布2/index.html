<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游景点评论系统</title>
    <style>
        body {
            font-family: 微软雅黑, sans-serif;
            background: #eee;
            padding: 20px;
        }
        
        .comment-box {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .input-area {
            margin-bottom: 15px;
        }
        
        .input-area input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        
        .input-area textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            resize: none;
        }
        
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .comment-list {
            margin-top: 20px;
        }
        
        .comment {
            background: #f9f9f9;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #4CAF50;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }
        
        .comment-content {
            margin-top: 5px;
        }
        
        .empty-tip {
            text-align: center;
            color: #999;
            font-style: italic;
        }

        /* 新增样式 */
        .rating {
            margin-bottom: 10px;
        }
        
        .rating select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }
        
        .location-tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .rating-display {
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="comment-box">
        <h2>旅游景点评论</h2>
        <div class="input-area">
            <input type="text" id="username" placeholder="请输入您的昵称">
            <div class="rating">
                <select id="location" name="location">
                    <option value="">选择景点</option>
                    <option value="长城">长城</option>
                    <option value="故宫">故宫</option>
                    <option value="西湖">西湖</option>
                    <option value="黄山">黄山</option>
                    <option value="张家界">张家界</option>
                </select>
                <select id="rating" name="rating">
                    <option value="">评分</option>
                    <option value="5">5星 - 非常满意</option>
                    <option value="4">4星 - 满意</option>
                    <option value="3">3星 - 一般</option>
                    <option value="2">2星 - 不满意</option>
                    <option value="1">1星 - 非常不满意</option>
                </select>
            </div>
            <textarea id="comment-text" placeholder="请分享您的旅游体验和建议"></textarea>
        </div>
        <button id="submit-btn" class="btn">发表评论</button>
        
        <div class="comment-list">
            <h3>评论列表 (<span id="comment-count">0</span>条)</h3>
            <div id="comments-container">
                <p class="empty-tip">暂无评论</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
