<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 400px;
            height: 200px;
            margin: 50px auto;
            position: relative;
            border: 1px solid #ccc;
        }
        
        .img-box {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .img-box img {
            width: 100%;
            height: 100%;
            display: none;
        }
        
        .img-box img.active {
            display: block;
        }
        
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .prev {
            left: 0;
        }
        
        .next {
            right: 0;
        }
        
        .dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #ccc;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }
        
        .dot.active {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img-box">
            <img src="https://via.placeholder.com/400x200/ff5555/ffffff?text=图片1" class="active">
            <img src="https://via.placeholder.com/400x200/55ff55/ffffff?text=图片2">
            <img src="https://via.placeholder.com/400x200/5555ff/ffffff?text=图片3">
        </div>
        
        <button class="btn prev">←</button>
        <button class="btn next">→</button>
        
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
