<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 优购商城</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h2>新用户注册</h2>
                <p>加入优购商城，享受优质购物体验</p>
            </div>
            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <label for="regUsername">用户名 <span class="required">*</span></label>
                    <input type="text" id="regUsername" name="username" placeholder="请输入用户名（至少6个字符）" required>
                    <span class="error-message" id="regUsernameError"></span>
                </div>
                <div class="form-group">
                    <label for="email">邮箱 <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱地址" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="phone">手机号码 <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号码" required>
                    <span class="error-message" id="phoneError"></span>
                </div>
                <div class="form-group">
                    <label for="regPassword">密码 <span class="required">*</span></label>
                    <input type="password" id="regPassword" name="password" placeholder="请输入密码（至少6个字符）" required>
                    <span class="error-message" id="regPasswordError"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码 <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeTerms" required>
                        <span class="checkmark"></span>
                        我已阅读并同意<a href="#" class="terms-link">用户协议</a>和<a href="#" class="privacy-link">隐私政策</a>
                    </label>
                    <span class="error-message" id="agreeTermsError"></span>
                </div>
                <button type="submit" class="btn btn-register-submit">注册</button>
                <div class="login-link">
                    <p>已有账号？<a href="login.html">立即登录</a></p>
                </div>
            </form>
        </div>
        <div class="back-to-home">
            <a href="index.html" class="btn btn-secondary">返回首页</a>
        </div>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
