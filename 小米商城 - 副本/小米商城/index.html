    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">

            <aside class="sidebar">
                <ul class="category-menu">
                    <li>
                        <a href="#">
                            <img src="images/icon1.png" alt="手机">
                            <span>手机</span>
                            <img src="images/arrow.png" alt="箭头" class="arrow">
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img src="images/icon2.png" alt="电视">
                            <span>电视</span>
                            <img src="images/arrow.png" alt="箭头" class="arrow">
                        </a>
                    </li>
                    <li>

                    <span class="indicator"></span>
                    <span class="indicator"></span>
